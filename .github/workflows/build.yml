name: Daten bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'data/**', '.github/workflows/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: osmium installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Japan-Auszug von Geofabrik laden
        run: |
          curl -fSL --retry 3 -o japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf
          ls -lh japan.osm.pbf

      - name: Gemeindegrenzen herauslösen
        run: |
          osmium tags-filter japan.osm.pbf r/admin_level=7 -o adm.osm.pbf --overwrite
          osmium export adm.osm.pbf -c scripts/export_adm.json -f geojsonseq --geometry-types=polygon -o adm.geojsonseq --overwrite
          ls -lh adm.osm.pbf adm.geojsonseq

      - name: Relevante Objekte filtern
        run: |
          osmium tags-filter japan.osm.pbf --expressions scripts/filter.txt -o filtered.osm.pbf --overwrite
          rm japan.osm.pbf
          ls -lh filtered.osm.pbf

      - name: Als GeoJSON exportieren
        run: |
          osmium export filtered.osm.pbf -c scripts/export.json -f geojsonseq -o filtered.geojsonseq --overwrite
          ls -lh filtered.geojsonseq

      - name: Kacheln bauen
        run: |
          python3 scripts/build_tiles.py filtered.geojsonseq site data/chains.json
          cp data/municipalities.json site/

      - name: Gemeinde-Raster in die Kacheln schreiben
        run: |
          python3 scripts/build_muni_grid.py adm.geojsonseq data/municipalities.json site/tiles 四季彩の丘,青い池,ファーム富田,宗谷岬,日本最北端の地,首里城,ラベンダーイースト | tee grid.log
          python3 -c "import json;s=json.loads(open('grid.log').read().strip().splitlines()[-1]);print('::notice title=Gemeinde-Raster::'+'%0A'.join([f\"{s['munis_with_boundary']} von {s['munis_total']} Gemeinden, {s['cells']} Landzellen, +{s['bytes_added']/1e6:.2f} MB\"]+s['checks']))"

      - name: Kettenfotos von Wikimedia Commons holen
        continue-on-error: true
        run: |
          python3 scripts/fetch_images.py data/chains.json site
          du -sh site/img || true
          # Auswahl als Hinweis am Lauf sichtbar machen (lesbar über die Checks-API)
          python3 -c "import json;d=json.load(open('site/chains.json'))['chains'];print('::notice title=Kettenfotos::'+'%0A'.join(k+' | '+v['file']+' | '+v['license'] for k,v in d.items()))" || true

      - name: Startseite
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>JapanOrace-Daten</title><p>Datenpaket für JapanOrace. Quellen: © OpenStreetMap-Mitwirkende (ODbL), Wikidata (CC0), Ladenfotos von Wikimedia Commons (Urheber und Lizenz in chains.json).</p>' > site/index.html
          du -sh site; ls site | head

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
